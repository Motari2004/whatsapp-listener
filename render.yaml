services:
  - type: web
    name: whatsapp-listener
    env: docker
    plan: starter # persistent disks require a paid plan, not the free tier
    disk:
      name: whatsapp-session
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: SESSION_PATH
        value: /data/.wwebjs_auth
      - key: DASHBOARD_TOKEN
        sync: false # set this manually in the Render dashboard to a long random string
      - key: WEBHOOK_URL
        sync: false # optional, set manually if you want messages forwarded somewhere
    healthCheckPath: /health
