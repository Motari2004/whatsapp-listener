services:
  - type: web
    name: whatsapp-listener
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
    plan: free
    autoDeploy: true
    buildFilter:
      paths:
        - src/**/*.js
        - package.json
        - package-lock.json